# -----------------------------------------------------
# Autostart:
# -----------------------------------------------------
# --> generally not needed when using uwsm - 
# should all be taken care of by SystemD services <--
# Start Polkit
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
# exec /usr/lib/polkit-kde-authentication-agent-1
# exec --no-startup-id /usr/lib/hyprpolkitagent/hyprpolkitagent &

exec dunst &
exec ~/.config/.scripts/ut-save-env
# -----------------------------------------------------
# Idle configuration
# Example configuration:
# -----------------------------------------------------
# In autostart.conf
# exec swayidle -w \
#       timeout 600 'swaylock -f -c 000000' \
#       timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
#       before-sleep 'swaylock -f -c 000000'
#
# This will lock your screen after 300 seconds of inactivity, then turn off
# your displays after another 300 seconds, and turn your screens back on when
# resumed. It will also lock your screen before your computer goes to sleep.

# Using swayidle to start swaylock
exec swayidle -w \
        timeout 900 'swaylock -f -c 000000' \
        timeout 1600 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
        before-sleep 'swaylock -f -c 000000'

# Load cliphist history
exec wl-paste --watch cliphist store

# Start EMACS Server
# exec-once = /usr/bin/emacs --daemon=serve

# Startup the system tray applets:
# exec nm-tray
# exec pasystray
exec garuda-system-maintenance
# exec blueman-applet
exec flameshot
exec firewall-applet

# toggle_kmonad
# exec-once = $HOME/.config/.scripts/toggle_kmonad.sh
# exec-once =  kmonad $HOME/.config/kmonad/k350.kbd

# set bluelight filter
exec ~/.config/.scripts/ut-bluelight
# exec-once = wlsunset -t 2000 -T 2300
# exec-once = wlsunset -t 3000 -T 4000

# # Initialize swww
exec awww query || awww-daemon

# Load last wallpaper and waybar with pywal colors
exec ~/.config/.scripts/wb-launch

# no x here
exec xwayland disable

# set enviroment variables
# exec systemctl --user set-environment TERM=xterm-256color
